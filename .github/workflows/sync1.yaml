# Scheduled sync: download the latest release binary, relay new Telegram posts
# into Ech0, then commit the updated cursor state back to the repo.
name: sync

on:
  schedule:
    # Every 20 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 串行排队，不杀掉正在运行的任务，防止游标state.json损坏
concurrency:
  group: relay-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 1  # 全局1分钟超时，超时直接中断任务
    steps:
      - name: "🔍 打印运行上下文信息"
        timeout-minutes: 1
        run: |
          echo "GITHUB_REPOSITORY: ${{ github.repository }}"
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "Workflow trigger: ${{ github.event_name }}"

      - name: 📥 Checkout source code
        uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          fetch-depth: 0 # 完整拉取所有提交历史，避免推送异常

      - name: 🔄 Pull latest remote code
        id: git_pull
        timeout-minutes: 1
        run: |
          set -e
          git pull origin main
        continue-on-error: true

      - name: ⚠️ Git pull 异常处理
        if: steps.git_pull.outcome != 'success'
        run: |
          echo "::error::git pull origin main 失败！"
          echo "常见原因：网络波动、仓库访问受限、分支main不存在"
          exit 1

      - name: 📦 Install gh cli
        id: install_gh
        timeout-minutes: 1
        run: |
          sudo apt update
          sudo apt install gh -y
          gh --version
        continue-on-error: true

      - name: ⚠️ gh cli安装失败处理
        if: steps.install_gh.outcome != 'success'
        run: |
          echo "::error::gh cli工具安装失败，无法下载release二进制"
          exit 1

      - name: ⬇️ Download latest relay binary
        id: download_bin
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f ./relay skip.sync
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'ech0-relay-linux-amd64' -O ./relay; then
            chmod +x ./relay
            ls -lh ./relay
            echo "Binary downloaded successfully"
          else
            echo "::warning::Release中未找到 ech0‑relay‑linux‑amd64 二进制文件"
            echo "检查点：1. tag是否已经发布正式非draft release；2. 资产文件名匹配；3.GITHUB_TOKEN权限contents:write"
            touch skip.sync
          fi

      - name: 🚀 Run relay
        id: run
        timeout-minutes: 1
        continue-on-error: true
        env:
          ECH0_MYBLOG_TOKEN: ${{ secrets.ECH0_MYBLOG_TOKEN }}
          # 多实例在这里追加，示例：
          # ECH0_VLOG_TOKEN: ${{ secrets.ECH0_VLOG_TOKEN }}
        run: |
          if [ -f skip.sync ]; then
            echo "ℹ️ 二进制缺失，跳过relay执行"
            exit 0
          fi
          if [ ! -f ./relay ]; then
            echo "::error::relay二进制文件丢失"
            touch skip.sync
            exit 0
          fi
          ./relay -config config.yaml -state state/state.json

      - name: 💾 Commit cursor state
        id: commit_state
        timeout-minutes: 1
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add state/state.json
          # 无变更直接退出
          if git diff --staged --quiet; then
            echo "ℹ️ state.json 无变更，无需提交"
            exit 0
          fi

          git commit -m 'chore(state): update cursors [skip ci]'

          # rebase拉远程，冲突时远程state.json优先
          git pull --rebase -X theirs origin main

          # push重试最多3次
          PUSH_OK=0
          for i in {1..3}; do
            if git push; then
              echo "✅ Git push success"
              PUSH_OK=1
              break
            fi
            echo "⚠️ Git push failed, retry $i/3, sleep 3s"
            sleep 3
          done

          if [ "$PUSH_OK" -ne 1 ]; then
            echo "::error::git push全部重试失败，无法提交state游标！"
            echo "常见：并发写冲突、token权限不足、仓库保护规则拦截"
            exit 1
          fi
        continue-on-error: true

      - name: ⚠️ 提交保存状态异常处理
        if: steps.commit_state.outcome != 'success'
        run: |
          echo "::error::state.json游标提交/推送流程失败，游标没有落地仓库！"
          exit 1

      # relay程序运行失败，整体工作流标记失败
      - name: ❌ Propagate relay failure
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::relay程序执行失败，请查看Run relay步骤日志排查问题"
          exit 1
