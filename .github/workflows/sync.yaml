# Scheduled sync: download the latest release binary, relay new Telegram posts
# into Ech0, then commit the updated cursor state back to the repo.
name: sync

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 串行排队，不杀掉正在运行的任务，防止游标损坏
concurrency:
  group: relay-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 完整拉取所有提交历史，避免推送异常

      # 每次运行前先拉取远程最新代码，前置规避冲突
      - name: Pull latest remote code
        run: git pull origin main

      - name: Install gh cli
        run: sudo apt update && sudo apt install gh -y

      - name: Download latest relay binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'ech0-relay-linux-amd64' -O ./relay; then
            chmod +x ./relay
            echo "Binary downloaded successfully"
          else
            echo "Warning: No relay binary found in release, skip sync"
            touch skip.sync
          fi

      - name: Run relay
        id: run
        continue-on-error: true
        env:
          ECH0_MYBLOG_TOKEN: ${{ secrets.ECH0_MYBLOG_TOKEN }}
          # 多实例在这里追加，示例：
          # ECH0_VLOG_TOKEN: ${{ secrets.ECH0_VLOG_TOKEN }}
        run: |
          if [ -f skip.sync ]; then
            echo "Skip relay run due to missing binary"
            exit 0
          fi
          ./relay -config config.yaml -state state/state.json

      - name: Commit cursor state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add state/state.json
          # 无变更直接退出
          if git diff --staged --quiet; then
            echo "no state changes"
            exit 0
          fi

          # 提交本地游标变更
          git commit -m 'chore(state): update cursors [skip ci]'

          # rebase 拉取远程最新，冲突时远程 state.json 优先
          git pull --rebase -X theirs origin main

          # push 失败自动重试3次
          for i in {1..3}; do
            if git push; then
              echo "Push success"
              break
            fi
            echo "Push failed, retry $i/3, wait 3s..."
            sleep 3
          done

      # 即使状态已保存，中继运行失败也要标记工作流失败
      - name: Propagate relay failure
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::relay run failed — see the 'Run relay' step logs"
          exit 1
